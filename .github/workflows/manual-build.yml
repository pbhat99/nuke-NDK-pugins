name: Manual Multi-Platform Plugin Builder

on:
  workflow_dispatch:
    inputs:
      nuke_version:
        description: 'Nuke Version to build (e.g. 17.1, 16.0, 15.1, or ALL)'
        required: true
        default: '17.1'
        type: string

      plugin_target:
        description: 'Plugin to Build'
        required: true
        default: 'ALL'
        type: choice
        options:
          - 'ALL'
          - 'ImageTool'
          - 'bamDeVe'
          - 'cropMore'
          - 'rotoReducer'
          - 'AlphaToRoto'
          - 'ColorGrade'
          - 'DeepC'
          - 'DeepErode'
          - 'FastNoiseLite'
          - 'NukeShenanigans'
          - 'USDsubD'

      commit_and_release:
        description: 'Commit to repository & publish GitHub Release immediately? (Leave UNCHECKED to test artifacts first)'
        required: true
        default: false
        type: boolean

      release_version:
        description: 'Release Version Tag (e.g. v1.0.0 or auto)'
        required: false
        default: 'auto'
        type: string

      release_title:
        description: 'Release Title'
        required: false
        default: 'Nuke Plugins Multi-Platform Release'
        type: string

permissions:
  contents: write

jobs:
  # --------------------------------------------------------------------------
  # 1. Parse Version Inputs (Always targets all 3 platforms: Windows, Linux, macOS)
  # --------------------------------------------------------------------------
  prepare-matrix:
    name: Parse Inputs
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.set-matrix.outputs.versions }}
    steps:
      - id: set-matrix
        run: |
          RAW_VER="${{ github.event.inputs.nuke_version }}"
          if [ "$RAW_VER" = "ALL" ]; then
            echo 'versions=["17.1", "16.0"]' >> $GITHUB_OUTPUT
          else
            echo "versions=[\"$RAW_VER\"]" >> $GITHUB_OUTPUT
          fi

  # --------------------------------------------------------------------------
  # 2. Multi-Platform Build Job (Always builds Windows, Linux, and macOS)
  # --------------------------------------------------------------------------
  build:
    needs: prepare-matrix
    name: Build (${{ matrix.platform }} - Nuke ${{ matrix.nuke_version }})
    runs-on: ${{ matrix.platform == 'Windows' && 'windows-latest' || (matrix.platform == 'macOS' && 'macos-latest' || 'ubuntu-latest') }}
    strategy:
      fail-fast: false
      matrix:
        platform: [Windows, Linux, macOS]
        nuke_version: ${{ fromJson(needs.prepare-matrix.outputs.versions) }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup CMake & Ninja
        uses: lukka/get-cmake@latest

      - name: Setup Nuke NDK
        run: |
          python .github/scripts/setup_ndk.py --platform ${{ matrix.platform }} --version ${{ matrix.nuke_version }}

      - name: Compile Plugins (${{ matrix.platform }})
        run: |
          python .github/scripts/build_plugins.py --platform ${{ matrix.platform }} --version ${{ matrix.nuke_version }} --plugin "${{ github.event.inputs.plugin_target }}" --ndk "${{ env.NDKDIR }}"

      - name: Upload Platform Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: COMPILED-${{ matrix.platform }}-Nuke${{ matrix.nuke_version }}
          path: COMPILED/
          retention-days: 7

  # --------------------------------------------------------------------------
  # 3. Package 3 Platform ZIPs (pbhat99-build-<version>-<platform>.zip)
  # --------------------------------------------------------------------------
  package-and-release:
    needs: [prepare-matrix, build]
    name: Package 3 Platform ZIPs & Optional Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts/

      - name: Consolidate All Compiled Versions
        run: |
          # Merge newly built binaries into workspace COMPILED/
          mkdir -p COMPILED
          if [ -d "downloaded-artifacts" ]; then
            for d in downloaded-artifacts/*; do
              if [ -d "$d" ]; then
                echo "Merging artifacts from $d ..."
                cp -rn "$d"/* COMPILED/ 2>/dev/null || true
              fi
            done
          fi

      - name: Resolve Version Tag
        run: |
          RAW="${{ github.event.inputs.release_version }}"
          if [ -z "$RAW" ] || [ "$RAW" = "auto" ]; then
            LATEST_TAG=$(git describe --tags $(git rev-list --tags --max-count=1) 2>/dev/null || echo "")
            if [ -z "$LATEST_TAG" ]; then
              VERSION="v1.0.0"
            else
              NUMS="${LATEST_TAG#v}"
              MAJOR=$(echo "$NUMS" | cut -d. -f1)
              MINOR=$(echo "$NUMS" | cut -d. -f2)
              PATCH=$(echo "$NUMS" | cut -d. -f3)
              PATCH=$((PATCH + 1))
              VERSION="v${MAJOR}.${MINOR}.${PATCH}"
            fi
          else
            VERSION="$RAW"
          fi
          echo "Resolved Release Version: $VERSION"
          echo "FINAL_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Package 3 Separate Platform ZIP Files
        run: |
          VERSION="${{ env.FINAL_VERSION }}"
          echo "Packaging separate per-platform ZIP archives for $VERSION ..."

          # 1. Windows: pbhat99-build-<version>-windows.zip (all compiled Nuke versions inside WIN/)
          if [ -d "COMPILED/WIN" ]; then
            zip -r "pbhat99-build-${VERSION}-windows.zip" COMPILED/WIN/ COMPILED/init.py README.md
          fi

          # 2. Linux: pbhat99-build-<version>-linux.zip (all compiled Nuke versions inside LINUX/)
          if [ -d "COMPILED/LINUX" ]; then
            zip -r "pbhat99-build-${VERSION}-linux.zip" COMPILED/LINUX/ COMPILED/init.py README.md
          fi

          # 3. macOS: pbhat99-build-<version>-macos.zip (all compiled Nuke versions inside MAC/)
          if [ -d "COMPILED/MAC" ]; then
            zip -r "pbhat99-build-${VERSION}-macos.zip" COMPILED/MAC/ COMPILED/init.py README.md
          fi

      - name: Upload Testable ZIP Artifacts (Download to test before releasing)
        uses: actions/upload-artifact@v4
        with:
          name: pbhat99-build-zips
          path: pbhat99-build-*.zip
          retention-days: 14

      - name: Commit Compiled Binaries to Repository (if enabled)
        if: github.event.inputs.commit_and_release == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "release: update compiled binaries for release ${{ env.FINAL_VERSION }}"
          file_pattern: 'COMPILED/**'

      - name: Publish GitHub Release (if enabled)
        if: github.event.inputs.commit_and_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.FINAL_VERSION }}
          name: "${{ github.event.inputs.release_title }} (${{ env.FINAL_VERSION }})"
          files: |
            pbhat99-build-*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
